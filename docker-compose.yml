services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://phatracare.phatra-leasing.com}
        NEXT_PUBLIC_GTM_ID: ${NEXT_PUBLIC_GTM_ID:-}
        NEXT_PUBLIC_LINE_URL: ${NEXT_PUBLIC_LINE_URL:-https://line.me}
        NEXT_PUBLIC_GA4_DEBUG: ${NEXT_PUBLIC_GA4_DEBUG:-false}
    image: phatra-care-web:latest
    container_name: phatra-care-web
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
    volumes:
      - next-image-cache:/app/.next/cache

  # Dev mode: hot reload, no rebuild. Save a file -> browser updates in ~1s.
  #   docker compose stop web            # free port 3000 (optional)
  #   docker compose --profile dev up dev
  dev:
    profiles: ["dev"]
    image: node:20-alpine
    container_name: phatra-care-dev
    working_dir: /app
    command: sh -c "npm ci && npx next dev -H 0.0.0.0 -p 3000"
    ports:
      - "${DEV_PORT:-3001}:3000"
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_LINE_URL: ${NEXT_PUBLIC_LINE_URL:-https://line.me}
      NEXT_PUBLIC_GA4_DEBUG: ${NEXT_PUBLIC_GA4_DEBUG:-false}
    volumes:
      - .:/app
      - dev-node-modules:/app/node_modules
      - dev-next:/app/.next

volumes:
  next-image-cache:
  dev-node-modules:
  dev-next:
